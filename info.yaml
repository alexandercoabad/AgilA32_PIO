# Tiny Tapeout project information
project:
  title:        "AgilA32"      # Project title
  author:       "Alexander Co Abad"      # Your name
  discord:      "alexandercoabad_25756"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A minimal from-scratch RV32I CPU, inspired by the discrete-logic Pineapple ONE RISC-V computer, reimplemented as synthesizable Verilog for a single Tiny Tapeout tile."
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     1000000       # 1 MHz -- conservative starting point; matches CLOCK_PERIOD in src/config.json (1000 ns). Raise both together once you've confirmed timing closure.

  # How many tiles your design occupies? A single IHP tile is roughly 200x150 uM.
  tiles: "6x2"          # Synthesis estimate: ~0.174 mm2 cell area (~10 tiles at 60% density). Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_agila32"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_agila32.v"
    - "rv32i_core.v"
    - "mem.v"
    - "qspi_shared_engine.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "SW0"
  ui[1]: "SW1"
  ui[2]: "SW2"
  ui[3]: "SW3"
  ui[4]: "SW4"
  ui[5]: "SW5"
  ui[6]: "SW6"
  ui[7]: "SW7"

  # Outputs
  uo[0]: "LED0"
  uo[1]: "LED1"
  uo[2]: "LED2"
  uo[3]: "LED3"
  uo[4]: "LED4"
  uo[5]: "LED5"
  uo[6]: "LED6"
  uo[7]: "LED7 / PWM (selected by PIN_MUX, 0xFA)"

  # Bidirectional pins
  uio[0]: "qspi_cs0"
  uio[1]: "qspi_mosi"
  uio[2]: "qspi_miso"
  uio[3]: "qspi_sck"
  uio[4]: ""
  uio[5]: ""
  uio[6]: "qspi_cs1"
  uio[7]: "qspi_cs2"

# Do not change!
yaml_version: 6
