# Protocol-level cocotb tests for the PIO block on its own (pio.v is the toplevel, so the
# CPU is replaced by cocotb driving the same valid/we/addr/wdata bus).
#     cd test && make -f Makefile.proto
SIM ?= icarus
TOPLEVEL_LANG ?= verilog
SRC_DIR = $(PWD)/../src
VERILOG_SOURCES = $(SRC_DIR)/pio.v $(SRC_DIR)/pio_sm.v $(SRC_DIR)/pio_fifo.v
COMPILE_ARGS += -I$(SRC_DIR)
TOPLEVEL = pio
COCOTB_TEST_MODULES = test_pio_protocols,test_pio_swd
SIM_BUILD = sim_build/proto
include $(shell cocotb-config --makefiles)/Makefile.sim
